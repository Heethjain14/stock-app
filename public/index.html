<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>StockApp</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StockApp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Mobile browsers: the visible height changes with the address bar, so prefer dvh. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      /* The app scrolls inside its own lists; never let the page itself scroll or pan sideways. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        max-width: 100vw;
        flex: 1;
      }
      /* iOS zooms the page in when a focused field is smaller than 16px, which looks like the
         layout no longer fits the screen. */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
      /* Fields draw their own focus border; the browser outline doubles it up. */
      input:focus,
      textarea:focus {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
